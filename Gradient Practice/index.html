<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Gradients Practice</h1>

    <section class="container">

        <!-- Linear Gradients -->
        <div class="card linear-1">
            <h2>Linear Gradient</h2>
            <p>Left to Right</p>
        </div>

        <div class="card linear-2">
            <h2>Linear Gradient</h2>
            <p>Diagonal</p>
        </div>

        <div class="card linear-3">
            <h2>Linear Gradient</h2>
            <p>Multiple Colors</p>
        </div>

        <!-- Radial Gradients -->
        <div class="card radial-1">
            <h2>Radial Gradient</h2>
            <p>Circle</p>
        </div>

        <div class="card radial-2">
            <h2>Radial Gradient</h2>
            <p>Ellipse</p>
        </div>

        <div class="card radial-3">
            <h2>Radial Gradient</h2>
            <p>At Different Position</p>
        </div>

        <!-- Conic Gradients -->
        <div class="card conic-1">
            <h2>Conic Gradient</h2>
            <p>Basic</p>
        </div>

        <div class="card conic-2">
            <h2>Conic Gradient</h2>
            <p>Multiple Colors</p>
        </div>

        <div class="card conic-3">
            <h2>Conic Gradient</h2>
            <p>Starting Angle</p>
        </div>

    </section>

</body>
</html>
