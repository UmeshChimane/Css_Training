<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animation Sandbox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- Spinner -->
        <section class="box" id="spinner">

            <div class="section-title">
                <span>01</span>
                <h2>Loading Spinner</h2>
            </div>
            <br>

    
            <div class="demo">
                <div class="spinner"></div>
            </div>

        </section>


        <!-- Hamburger -->
        <section class="box" id="menu">

            <div class="section-title">
                <span>02</span>
                <h2>Hamburger Menu</h2>
            </div>
            <br>


    
            <div class="demo">
                <button class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

        </section>


        <!-- Flip Card -->
        <section class="box" id="card">

            <div class="section-title">
                <span>03</span>
                <h2>3D Flip Card</h2>
            </div>

           <br>

            <div class="demo">

                <div class="flip-card">

                    <div class="flip-inner">

                        <div class="front">
                            <h3>Frontend</h3>
                            <p>Hover Me</p>
                        </div>

                        <div class="back">
                            <h3>Skills</h3>
                            <p>HTML • CSS • JavaScript</p>
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- Skeleton -->
        <section class="box" id="skeleton">

            <div class="section-title">
                <span>04</span>
                <h2>Skeleton Loading</h2>
            </div>

            <br>

            <div class="demo">

                <div class="skeleton-card">

                    <div class="skeleton image"></div>

                    <div class="skeleton title"></div>

                    <div class="skeleton text"></div>

                    <div class="skeleton text short"></div>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>CSS Animation Sandbox • Practice Project</p>
    </footer>


    <script src="scripts.js"></script>

</body>
</html>
